specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Microsoft Planner
providerId: microsoft-planner
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Project Management
  - Tasks
  - Microsoft Graph
  - Microsoft
description: Microsoft Planner is administered exclusively via the Microsoft Graph planner endpoints.
  Microsoft does not publish Planner-specific per-second / per-minute throttling numbers; Planner inherits
  the Microsoft Graph global ceiling (130,000 requests per 10 seconds per app) and the Identity & Access
  per-app-per-tenant ResourceUnit budget for user / group lookups. Returns 429 Too Many Requests with
  Retry-After.
sources:
  - https://learn.microsoft.com/en-us/graph/throttling
  - https://learn.microsoft.com/en-us/graph/throttling-limits
  - https://learn.microsoft.com/en-us/graph/api/resources/planner-overview
notes: No Planner-specific per-second numbers are published; values shown reflect inherited Microsoft
  Graph limits.
headers:
  retryAfter: Retry-After
  requestId: request-id
  throttleScope: x-ms-throttle-scope
  throttleLimit: x-ms-throttle-limit-percentage
responseCodes:
  throttled: 429
  serviceUnavailable: 503
  preconditionFailed: 412
limits:
  - name: Microsoft Graph global ceiling
    scope: application
    metric: requests_per_10_seconds
    limit: 130000
    timeFrame: second
  - name: Identity & Access (read) per app/tenant
    scope: app/tenant
    metric: resource_units_per_10_seconds
    limit: 3500–8000 RU per 10s based on tenant size
    timeFrame: second
  - name: Identity & Access (write) per app/tenant
    scope: app/tenant
    metric: requests_per_2m30s
    limit: 3000
    timeFrame: second
  - name: Planner endpoints
    scope: app/tenant
    metric: varies
    limit: see Microsoft Graph throttling guidance — no Planner-specific numbers published
policies:
  - name: ETag concurrency
    description: Planner uses optimistic concurrency. Every PATCH / DELETE must include the If-Match header
      with the resource ETag; mismatches return 412 Precondition Failed.
  - name: Backoff Strategy
    description: Honour Retry-After on 429 / 503; the Microsoft Graph SDK handlers do this automatically.
  - name: Use change notifications
    description: Subscribe to plan and task change notifications instead of polling.
  - name: Use $batch
    description: Combine read calls in $batch envelopes; each is throttled individually.
  - name: Group-aware writes
    description: Each plan is owned by a Microsoft 365 Group; bulk writes that touch many plans across
      a tenant should be rate-paced to avoid hitting Identity & Access write limits.
maintainers:

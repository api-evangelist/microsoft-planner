specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Microsoft Planner
providerId: microsoft-planner
publisherName: Microsoft Corporation
serviceCategory: Project and Task Management
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Project Management
  - Tasks
  - Microsoft 365
  - Planner
  - Microsoft
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Microsoft Planner: basic Planner is bundled with all paid Microsoft
  365 SKUs; advanced Project capabilities are sold as Planner Plan 1 / 3 / 5 per-user-per-month subscriptions.
  APIs included with the seat licence; no per-call charge.'
sources:
  - https://www.microsoft.com/en-us/microsoft-365/planner/microsoft-planner-pricing
  - https://learn.microsoft.com/en-us/graph/api/resources/planner-overview
billingModel:
  pricingCategory: Tiered Subscription (bundled with Microsoft 365)
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Microsoft Planner
  ServiceCategory: Project and Task Management
  ProviderName: Microsoft
  PublisherName: Microsoft Corporation
  InvoiceIssuerName: Microsoft Corporation
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: m365_seats
    description: Microsoft 365 seats that grant basic Planner
    unit: seat
    aggregation: sum
    dimensions:
      - tenant
      - sku
  - name: planner_premium_seats
    description: Planner Plan 1 / 3 / 5 seats (formerly Project Plan 1 / 3 / 5)
    unit: seat
    aggregation: sum
    dimensions:
      - tenant
      - sku
  - name: planner_api_requests
    description: Microsoft Graph planner API calls (no charge; tracked for throttling)
    unit: request
    aggregation: sum
    dimensions:
      - application
      - tenant
  - name: active_plans
    description: Plans currently owned by Microsoft 365 Groups in the tenant
    unit: plan
    aggregation: max
    dimensions:
      - tenant
principles:
  - name: Visibility
    description: Use Microsoft 365 admin centre licence reports for seat utilisation; capture Microsoft
      Graph throttling telemetry from request-id and x-ms-throttle headers for Planner API consumers.
  - name: Allocation
    description: Tag premium Planner Plan 1 / 3 / 5 seats to projects / business-units via Entra group-based
      licensing.
  - name: Optimization
    description: Stay on basic Planner for routine task management; reserve Plan 3 / 5 for portfolio-managed
      projects; replace polling code with Graph change notifications.
  - name: Accountability
    description: Project Management Office (PMO) owns Plan 3 / 5 utilisation; workplace IT owns the M365
      SKU mix; engineering owns Graph API consumption.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
